<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no">

  <title>Data Matrix Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3/dist/iife/reader/index.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #111;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 8px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* =========================
       КВАДРАТНАЯ КАМЕРА
    ========================= */

    #cameraBox {
      position: relative;

      width: 100%;
      aspect-ratio: 1 / 1;

      overflow: hidden;

      border-radius: 14px;

      background: #000;
    }

    #video {
      position: absolute;

      width: 100%;
      height: 100%;

      left: 0;
      top: 0;

      object-fit: cover;
    }


    /* =========================
       РАМКА DATA MATRIX
    ========================= */

    #aim {
      position: absolute;

      width: 55%;
      height: 55%;

      left: 22.5%;
      top: 22.5%;

      border: 3px solid white;
      border-radius: 8px;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,0.10);
    }


    /* =========================
       КНОПКИ
    ========================= */

    button {
      width: 100%;

      margin-top: 8px;
      padding: 17px;

      border: 0;
      border-radius: 12px;

      font-size: 21px;
      font-weight: bold;

      cursor: pointer;
    }

    #startButton {
      background: #ffffff;
      color: #111;
    }

    #scanButton {
      display: none;

      background: #20a447;
      color: white;
    }

    #scanButton:disabled {
      opacity: 0.55;
    }


    /* =========================
       СТАТУС
    ========================= */

    #status {
      margin-top: 8px;
      padding: 10px;

      min-height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: #222;
      color: white;

      text-align: center;

      font-size: 15px;
      font-weight: bold;
    }

    .success {
      background: #176b32 !important;
      color: white !important;
    }

    .error {
      background: #9e2020 !important;
      color: white !important;
    }

    .working {
      background: #765b00 !important;
      color: white !important;
    }


    /* =========================
       ПОСЛЕДНИЙ КОД
    ========================= */

    #lastCode {
      display: none;

      margin-top: 6px;
      padding: 8px;

      border-radius: 8px;

      background: #222;
      color: #ccc;

      font-size: 11px;

      word-break: break-all;
    }


    /* Canvas пользователю не показываем */

    #canvas {
      display: none;
    }

  </style>
</head>


<body>

<div class="container">

  <div id="cameraBox">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>

    <div id="aim"></div>

  </div>


  <button id="startButton">
    ЗАПУСТИТЬ КАМЕРУ
  </button>


  <button id="scanButton">
    РАСПОЗНАТЬ
  </button>


  <div id="status">
    Запустите камеру
  </div>


  <div id="lastCode"></div>


  <canvas id="canvas"></canvas>

</div>



<script>

/* =====================================================
   НАСТРОЙКИ
===================================================== */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby-aRQONo0El0YySDgfpcGkDG3B9u4vLcweo3AuGZc8P5gXUCBpxt6cwtnv8ut_9jlGSw/exec";


const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const startButton =
  document.getElementById("startButton");

const scanButton =
  document.getElementById("scanButton");


let stream = null;
let busy = false;



/* =====================================================
   ЗАПУСК КАМЕРЫ
===================================================== */

startButton.onclick =
  startCamera;


async function startCamera() {

  try {

    setStatus(
      "Запускаю камеру...",
      "working"
    );


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 3840
          },

          height: {
            ideal: 2160
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    startButton.style.display =
      "none";

    scanButton.style.display =
      "block";


    setStatus(
      "Наведите рамку на Data Matrix"
    );


    console.log(
      "Разрешение камеры:",
      video.videoWidth,
      "x",
      video.videoHeight
    );

  }

  catch (error) {

    console.error(error);

    setStatus(
      "Не удалось открыть камеру",
      "error"
    );

  }

}



/* =====================================================
   КНОПКА РАСПОЗНАТЬ
===================================================== */

scanButton.onclick =
  recognize;


async function recognize() {

  if (busy) {
    return;
  }


  if (!video.videoWidth) {

    setStatus(
      "Камера ещё не готова",
      "error"
    );

    return;
  }


  busy = true;

  scanButton.disabled =
    true;


  setStatus(
    "Распознаю...",
    "working"
  );


  try {

    let code = null;


    /*
      Сначала пробуем обычное изображение.

      Разные crop позволяют находить
      как крупный, так и маленький
      Data Matrix.
    */

    const crops = [

      1.00,
      0.75,
      0.60,
      0.50,
      0.40,
      0.30

    ];


    for (const crop of crops) {

      code =
        await tryFrame(
          crop,
          false
        );


      if (code) {
        break;
      }

    }



    /*
      Если не нашли —
      повторяем с усиленным контрастом.
    */

    if (!code) {

      const enhancedCrops = [

        0.75,
        0.60,
        0.50,
        0.40,
        0.30

      ];


      for (
        const crop of enhancedCrops
      ) {

        code =
          await tryFrame(
            crop,
            true
          );


        if (code) {
          break;
        }

      }

    }



    if (!code) {

      throw new Error(
        "Data Matrix не найден"
      );

    }



    showCode(code);


    setStatus(
      "Сохраняю...",
      "working"
    );



    await saveCode(code);



    setStatus(
      "✓ СОХРАНЕНО",
      "success"
    );



    /*
      Короткая вибрация после
      успешной записи.
    */

    if (navigator.vibrate) {

      navigator.vibrate(100);

    }



    /*
      Через небольшой промежуток
      снова показываем приглашение
      к следующему сканированию.
    */

    setTimeout(function() {

      setStatus(
        "Готово. Наведите следующий Data Matrix"
      );

    }, 900);


  }

  catch (error) {

    console.error(error);


    setStatus(
      "Не найден. Наведите точнее и повторите.",
      "error"
    );

  }


  busy = false;

  scanButton.disabled =
    false;

}



/* =====================================================
   ПОПЫТКА РАСПОЗНАВАНИЯ
===================================================== */

async function tryFrame(
  cropRatio,
  enhance
) {

  const sw =
    video.videoWidth;

  const sh =
    video.videoHeight;



  /*
    Вырезаем квадратную область
    из центра исходного кадра.
  */

  const cropSize =
    Math.floor(

      Math.min(
        sw,
        sh
      )

      * cropRatio

    );


  const sx =
    Math.floor(
      (sw - cropSize) / 2
    );


  const sy =
    Math.floor(
      (sh - cropSize) / 2
    );



  /*
    Центральный участок увеличиваем.

    Максимум 2200x2200,
    чтобы не перегружать телефон.
  */

  const outputSize =
    Math.min(

      2200,

      Math.max(
        cropSize,
        1400
      )

    );



  canvas.width =
    outputSize;

  canvas.height =
    outputSize;



  const ctx =
    canvas.getContext(

      "2d",

      {
        willReadFrequently: true
      }

    );



  ctx.imageSmoothingEnabled =
    false;



  ctx.drawImage(

    video,

    sx,
    sy,
    cropSize,
    cropSize,

    0,
    0,
    outputSize,
    outputSize

  );



  let imageData =
    ctx.getImageData(

      0,
      0,

      outputSize,
      outputSize

    );



  /*
    Дополнительная обработка
    изображения при второй попытке.
  */

  if (enhance) {

    enhanceContrast(
      imageData
    );

  }



  /*
    ZXing-C++ / WASM
  */

  const results =
    await ZXingWASM.readBarcodes(

      imageData,

      {

        formats: [
          "DataMatrix"
        ],

        tryHarder: true,

        tryRotate: true,

        tryInvert: true,

        tryDownscale: true,

        tryDenoise: true,

        maxNumberOfSymbols: 1

      }

    );



  if (
    results &&
    results.length > 0
  ) {


    for (
      const result of results
    ) {


      if (
        result &&
        result.isValid
      ) {


        console.log(
          "ZXing:",
          result
        );


        /*
          ZXing показывает GS1
          в человекочитаемом виде:

          (01)...(21)...(93)...

          Возвращаем формат,
          который нужен вам для
          дальнейшей обработки.
        */

        let code =
          result.text || "";


        code =
          code

            .replace(
              /^\(01\)/,
              "01"
            )

            .replace(
              /\(21\)/,
              "21"
            )

            .replace(
              /\(91\)/g,
              "\x1D91"
            )

            .replace(
              /\(92\)/g,
              "\x1D92"
            )

            .replace(
              /\(93\)/g,
              "\x1D93"
            );


        return code;

      }

    }

  }


  return null;

}



/* =====================================================
   УСИЛЕНИЕ КОНТРАСТА
===================================================== */

function enhanceContrast(
  imageData
) {

  const data =
    imageData.data;


  const contrast =
    1.6;



  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {


    const gray =

      0.299 * data[i] +

      0.587 * data[i + 1] +

      0.114 * data[i + 2];



    let value =

      (gray - 128)

      * contrast

      + 128;



    value =
      Math.max(

        0,

        Math.min(
          255,
          value
        )

      );



    data[i] =
      value;

    data[i + 1] =
      value;

    data[i + 2] =
      value;

  }

}



/* =====================================================
   ЗАПИСЬ В GOOGLE SHEETS
===================================================== */

async function saveCode(
  code
) {


  const url =

    SCRIPT_URL +

    "?code=" +

    encodeURIComponent(
      code
    );



  await fetch(

    url,

    {

      method: "GET",

      mode: "no-cors"

    }

  );

}



/* =====================================================
   СТАТУС
===================================================== */

function setStatus(
  text,
  className = ""
) {


  const element =
    document.getElementById(
      "status"
    );


  element.innerText =
    text;


  element.className =
    className;

}



/* =====================================================
   ПОСЛЕДНИЙ КОД
===================================================== */

function showCode(
  code
) {


  const element =
    document.getElementById(
      "lastCode"
    );


  element.style.display =
    "block";


  /*
    Чтобы невидимый GS-разделитель
    был понятен визуально,
    только на экране показываем
    его как <GS>.

    В Google Sheets отправляется
    настоящий символ ASCII 29.
  */

  const visibleCode =
    code.replace(
      /\x1D/g,
      "<GS>"
    );


  element.innerText =
    visibleCode;

}

</script>

</body>
</html>
