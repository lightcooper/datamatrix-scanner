<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Data Matrix Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3/dist/iife/reader/index.js"></script>


<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #111;
  font-family: Arial, sans-serif;
}

body {
  padding: 8px;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
}


/* КАМЕРА */

#cameraBox {
  position: relative;

  width: 100%;
  aspect-ratio: 1 / 1;

  overflow: hidden;

  border-radius: 14px;

  background: #000;
}


#video {
  position: absolute;

  width: 100%;
  height: 100%;

  left: 0;
  top: 0;

  object-fit: cover;
}


/* РАМКА */

#aim {
  position: absolute;

  width: 55%;
  height: 55%;

  left: 22.5%;
  top: 22.5%;

  border: 3px solid white;

  border-radius: 8px;

  pointer-events: none;
}


/* СЧЁТЧИК */

#counter {
  position: absolute;

  top: 10px;
  right: 10px;

  z-index: 10;

  padding: 8px 12px;

  border-radius: 20px;

  background: rgba(0,0,0,.75);

  color: white;

  font-size: 16px;

  font-weight: bold;
}


/* КНОПКИ */

button {
  width: 100%;

  padding: 16px;

  margin-top: 8px;

  border: 0;

  border-radius: 12px;

  font-size: 20px;

  font-weight: bold;

  cursor: pointer;
}


#startButton {
  background: white;
  color: #111;
}


#scanButton {
  display: none;

  background: #20a447;
  color: white;
}


#sendButton {
  display: none;

  background: #1769d2;
  color: white;
}


button:disabled {
  opacity: .5;
}


/* КОММЕНТАРИЙ */

#comment {
  display: none;

  width: 100%;

  margin-top: 8px;

  padding: 13px 14px;

  border: 0;

  border-radius: 10px;

  background: white;

  color: #111;

  font-family: Arial, sans-serif;

  font-size: 16px;

  outline: none;
}


#comment::placeholder {
  color: #777;
}


/* СТАТУС */

#status {
  margin-top: 8px;

  padding: 9px;

  min-height: 40px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 10px;

  background: #222;

  color: white;

  text-align: center;

  font-size: 14px;

  font-weight: bold;
}


.success {
  background: #176b32 !important;
}


.error {
  background: #9e2020 !important;
}


.working {
  background: #765b00 !important;
}


.duplicate {
  background: #744a8b !important;
}


#canvas {
  display: none;
}

</style>

</head>


<body>

<div class="container">


  <div id="cameraBox">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>


    <div id="aim"></div>


    <div id="counter">
      Уникальных: 0
    </div>

  </div>


  <button id="startButton">
    ЗАПУСТИТЬ КАМЕРУ
  </button>


  <button id="scanButton">
    РАСПОЗНАТЬ
  </button>


  <input
    type="text"
    id="comment"
    placeholder="Комментарий к партии">


  <button id="sendButton">
    ОТПРАВИТЬ
  </button>


  <div id="status">
    Запустите камеру
  </div>


  <canvas id="canvas"></canvas>


</div>



<script>


/* ===========================
   НАСТРОЙКИ
=========================== */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycby-aRQONo0El0YySDgfpcGkDG3B9u4vLcweo3AuGZc8P5gXUCBpxt6cwtnv8ut_9jlGSw/exec";


const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const startButton =
document.getElementById("startButton");

const scanButton =
document.getElementById("scanButton");

const sendButton =
document.getElementById("sendButton");

const commentInput =
document.getElementById("comment");

const counter =
document.getElementById("counter");


let stream = null;
let busy = false;


/*
  Set хранит только
  уникальные Data Matrix.
*/

const scannedCodes =
new Set();



/* ===========================
   КАМЕРА
=========================== */

startButton.onclick =
startCamera;


async function startCamera() {

  try {

    setStatus(
      "Запускаю камеру...",
      "working"
    );


    stream =
    await navigator.mediaDevices.getUserMedia({

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 3840
        },

        height: {
          ideal: 2160
        }

      },

      audio: false

    });


    video.srcObject =
    stream;


    await video.play();


    startButton.style.display =
    "none";

    scanButton.style.display =
    "block";

    commentInput.style.display =
    "block";


    setStatus(
      "Наведите на Data Matrix"
    );

  }

  catch (error) {

    console.error(error);

    setStatus(
      "Не удалось открыть камеру",
      "error"
    );

  }

}



/* ===========================
   РАСПОЗНАТЬ
=========================== */

scanButton.onclick =
recognize;


async function recognize() {

  if (busy) {
    return;
  }


  if (!video.videoWidth) {

    setStatus(
      "Камера ещё не готова",
      "error"
    );

    return;
  }


  busy = true;

  scanButton.disabled =
  true;


  setStatus(
    "Распознаю...",
    "working"
  );


  try {

    let code = null;


    const crops = [
      1.00,
      0.75,
      0.60,
      0.50,
      0.40,
      0.30
    ];


    /*
      Сначала обычное изображение.
    */

    for (
      const crop of crops
    ) {

      code =
      await tryFrame(
        crop,
        false
      );


      if (code) {
        break;
      }

    }


    /*
      Затем усиленный контраст.
    */

    if (!code) {

      for (
        const crop of [
          0.75,
          0.60,
          0.50,
          0.40,
          0.30
        ]
      ) {

        code =
        await tryFrame(
          crop,
          true
        );


        if (code) {
          break;
        }

      }

    }


    if (!code) {

      throw new Error(
        "Data Matrix не найден"
      );

    }



    /* ДУБЛЬ */

    if (
      scannedCodes.has(code)
    ) {

      setStatus(
        "⚠ Этот код уже считан",
        "duplicate"
      );


      vibrateDuplicate();

    }

    else {


      scannedCodes.add(code);


      updateCounter();


      setStatus(
        "✓ Добавлено",
        "success"
      );


      vibrateSuccess();

    }

  }

  catch (error) {

    console.error(error);


    setStatus(
      "Не найден. Попробуйте ещё раз.",
      "error"
    );

  }


  busy = false;

  scanButton.disabled =
  false;

}



/* ===========================
   ОТПРАВИТЬ
=========================== */

sendButton.onclick =
sendBatch;


async function sendBatch() {

  if (
    scannedCodes.size === 0
  ) {
    return;
  }


  const codes =
  Array.from(
    scannedCodes
  );


  /*
    Один комментарий применяется
    ко всей отправляемой партии.
  */

  const comment =
  commentInput.value.trim();


  sendButton.disabled =
  true;

  scanButton.disabled =
  true;

  commentInput.disabled =
  true;


  setStatus(
    "Отправляю " +
    codes.length +
    " кодов...",
    "working"
  );


  try {


    const url =

    SCRIPT_URL +

    "?codes=" +

    encodeURIComponent(
      JSON.stringify(codes)
    )

    +

    "&comment=" +

    encodeURIComponent(
      comment
    );



    await fetch(

      url,

      {
        method: "GET",
        mode: "no-cors"
      }

    );



    /*
      Очищаем партию только
      после отправки.
    */

    scannedCodes.clear();


    /*
      Комментарий тоже очищаем,
      чтобы случайно не применить
      его к следующей партии.
    */

    commentInput.value =
    "";


    updateCounter();


    setStatus(
      "✓ Отправлено: " +
      codes.length,
      "success"
    );


    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [100, 80, 100]
      );

    }

  }

  catch (error) {

    console.error(error);


    setStatus(
      "Ошибка отправки. Коды не удалены.",
      "error"
    );

  }


  sendButton.disabled =
  false;

  scanButton.disabled =
  false;

  commentInput.disabled =
  false;

}



/* ===========================
   СЧЁТЧИК
=========================== */

function updateCounter() {


  const count =
  scannedCodes.size;


  counter.innerText =
  "Уникальных: " +
  count;


  if (
    count > 0
  ) {

    sendButton.style.display =
    "block";


    sendButton.innerText =
    "ОТПРАВИТЬ (" +
    count +
    ")";

  }

  else {

    sendButton.style.display =
    "none";

  }

}



/* ===========================
   РАСПОЗНАВАНИЕ
=========================== */

async function tryFrame(
  cropRatio,
  enhance
) {


  const sw =
  video.videoWidth;

  const sh =
  video.videoHeight;


  const cropSize =
  Math.floor(

    Math.min(
      sw,
      sh
    )

    * cropRatio

  );


  const sx =
  Math.floor(
    (sw - cropSize) / 2
  );


  const sy =
  Math.floor(
    (sh - cropSize) / 2
  );


  const outputSize =
  Math.min(

    2200,

    Math.max(
      cropSize,
      1400
    )

  );


  canvas.width =
  outputSize;

  canvas.height =
  outputSize;


  const ctx =
  canvas.getContext(

    "2d",

    {
      willReadFrequently: true
    }

  );


  ctx.imageSmoothingEnabled =
  false;


  ctx.drawImage(

    video,

    sx,
    sy,
    cropSize,
    cropSize,

    0,
    0,
    outputSize,
    outputSize

  );


  let imageData =
  ctx.getImageData(

    0,
    0,

    outputSize,
    outputSize

  );


  if (
    enhance
  ) {

    enhanceContrast(
      imageData
    );

  }


  const results =
  await ZXingWASM.readBarcodes(

    imageData,

    {

      formats: [
        "DataMatrix"
      ],

      tryHarder: true,

      tryRotate: true,

      tryInvert: true,

      tryDownscale: true,

      tryDenoise: true,

      maxNumberOfSymbols: 1

    }

  );


  if (
    results &&
    results.length > 0
  ) {


    for (
      const result of results
    ) {


      if (
        result &&
        result.isValid
      ) {


        let code =
        result.text || "";


        /*
          GS1 -> требуемый формат.
        */

        code =
        code

        .replace(
          /^\(01\)/,
          "01"
        )

        .replace(
          /\(21\)/,
          "21"
        )

        .replace(
          /\(91\)/g,
          "\x1D91"
        )

        .replace(
          /\(92\)/g,
          "\x1D92"
        )

        .replace(
          /\(93\)/g,
          "\x1D93"
        );


        return code;

      }

    }

  }


  return null;

}



/* ===========================
   КОНТРАСТ
=========================== */

function enhanceContrast(
  imageData
) {


  const data =
  imageData.data;


  const contrast =
  1.6;


  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {


    const gray =

    0.299 * data[i] +

    0.587 * data[i + 1] +

    0.114 * data[i + 2];


    let value =

    (gray - 128)

    * contrast

    + 128;


    value =
    Math.max(

      0,

      Math.min(
        255,
        value
      )

    );


    data[i] =
    value;

    data[i + 1] =
    value;

    data[i + 2] =
    value;

  }

}



/* ===========================
   ВИБРАЦИЯ
=========================== */

function vibrateSuccess() {

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      80
    );

  }

}


function vibrateDuplicate() {

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      [50, 50, 50]
    );

  }

}



/* ===========================
   СТАТУС
=========================== */

function setStatus(
  text,
  className = ""
) {


  const element =
  document.getElementById(
    "status"
  );


  element.innerText =
  text;


  element.className =
  className;

}

</script>

</body>

</html>
