<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Data Matrix Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3/dist/iife/reader/index.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #111;
  font-family: Arial, sans-serif;
}

body {
  padding: 8px;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
}


/* =========================
   КАМЕРА
========================= */

#cameraBox {

  position: relative;

  width: 100%;
  aspect-ratio: 1 / 1;

  overflow: hidden;

  border-radius: 14px;

  background: #000;
}


/*
  Настоящий video скрыт.

  iPhone не сможет показать
  поверх него Play/Pause.
*/

#video {

  position: fixed;

  width: 1px;
  height: 1px;

  left: -10000px;
  top: -10000px;

  opacity: 0;

  pointer-events: none;
}


/*
  Пользователь видит canvas,
  на который постоянно копируется
  изображение с камеры.
*/

#previewCanvas {

  position: absolute;

  width: 100%;
  height: 100%;

  left: 0;
  top: 0;

  display: block;

  background: #000;
}


/* =========================
   РАМКА
========================= */

#aim {

  position: absolute;

  width: 55%;
  height: 55%;

  left: 22.5%;
  top: 22.5%;

  border: 3px solid white;

  border-radius: 8px;

  pointer-events: none;

  z-index: 5;
}


/* =========================
   СЧЁТЧИК
========================= */

#counter {

  position: absolute;

  top: 10px;
  right: 10px;

  z-index: 10;

  padding: 8px 12px;

  border-radius: 20px;

  background: rgba(0,0,0,.75);

  color: white;

  font-size: 16px;

  font-weight: bold;
}


/* =========================
   КНОПКИ
========================= */

button {

  width: 100%;

  padding: 16px;

  margin-top: 8px;

  border: 0;

  border-radius: 12px;

  font-size: 20px;

  font-weight: bold;

  cursor: pointer;
}


#startButton {

  background: white;
  color: #111;
}


#scanButton {

  display: none;

  background: #20a447;
  color: white;
}


#sendButton {

  display: none;

  background: #1769d2;
  color: white;
}


button:disabled {

  opacity: .5;
}


/* =========================
   КОММЕНТАРИЙ
========================= */

#comment {

  display: none;

  width: 100%;

  margin-top: 8px;

  padding: 13px 14px;

  border: 0;

  border-radius: 10px;

  background: white;
  color: #111;

  font-family: Arial, sans-serif;

  font-size: 16px;

  outline: none;
}


#comment::placeholder {

  color: #777;
}


/* =========================
   СТАТУС
========================= */

#status {

  margin-top: 8px;

  padding: 9px;

  min-height: 40px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 10px;

  background: #222;
  color: white;

  text-align: center;

  font-size: 14px;

  font-weight: bold;
}


.success {

  background: #176b32 !important;
}


.error {

  background: #9e2020 !important;
}


.working {

  background: #765b00 !important;
}


.duplicate {

  background: #744a8b !important;
}


/*
  Этот canvas используется
  только для ZXing.
*/

#scanCanvas {

  display: none;
}

</style>

</head>


<body>

<div class="container">


  <div id="cameraBox">


    <!-- Настоящее видео скрыто -->

    <video
      id="video"
      autoplay
      playsinline
      muted
      disablepictureinpicture>
    </video>


    <!-- Видимое изображение камеры -->

    <canvas id="previewCanvas"></canvas>


    <!-- Рамка -->

    <div id="aim"></div>


    <!-- Счётчик -->

    <div id="counter">
      Счетчик кодов: 0
    </div>


  </div>


  <button id="startButton">
    ЗАПУСТИТЬ КАМЕРУ
  </button>


  <button id="scanButton">
    РАСПОЗНАТЬ
  </button>


  <input
    type="text"
    id="comment"
    placeholder="Комментарий к партии">


  <button id="sendButton">
    ОТПРАВИТЬ
  </button>


  <div id="status">
    Запустите камеру
  </div>


  <!-- Canvas для распознавания -->

  <canvas id="scanCanvas"></canvas>


</div>



<script>


/* =====================================================
   НАСТРОЙКИ
===================================================== */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycby-aRQONo0El0YySDgfpcGkDG3B9u4vLcweo3AuGZc8P5gXUCBpxt6cwtnv8ut_9jlGSw/exec";


const video =
document.getElementById("video");


const previewCanvas =
document.getElementById("previewCanvas");


const scanCanvas =
document.getElementById("scanCanvas");


const startButton =
document.getElementById("startButton");


const scanButton =
document.getElementById("scanButton");


const sendButton =
document.getElementById("sendButton");


const commentInput =
document.getElementById("comment");


const counter =
document.getElementById("counter");


let stream = null;

let busy = false;

let previewRunning = false;


/*
  Set хранит только
  уникальные коды.
*/

const scannedCodes =
new Set();



/* =====================================================
   ЗАПУСК КАМЕРЫ
===================================================== */

startButton.onclick =
startCamera;


async function startCamera() {

  try {

    setStatus(
      "Запускаю камеру...",
      "working"
    );


    stream =
    await navigator.mediaDevices.getUserMedia({

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 3840
        },

        height: {
          ideal: 2160
        }

      },

      audio: false

    });


    video.srcObject =
    stream;


    await video.play();


    /*
      Ждём, пока браузер действительно
      получит размеры видеопотока.
    */

    await waitForVideo();


    startButton.style.display =
    "none";


    scanButton.style.display =
    "block";


    commentInput.style.display =
    "block";


    /*
      Запускаем собственный
      canvas-видоискатель.
    */

    startPreview();


    setStatus(
      "Наведите на Data Matrix"
    );


    console.log(
      "Камера:",
      video.videoWidth,
      "x",
      video.videoHeight
    );

  }

  catch (error) {

    console.error(error);


    setStatus(
      "Не удалось открыть камеру",
      "error"
    );

  }

}



/* =====================================================
   ОЖИДАНИЕ КАМЕРЫ
===================================================== */

function waitForVideo() {

  return new Promise(resolve => {


    if (
      video.videoWidth > 0 &&
      video.videoHeight > 0
    ) {

      resolve();

      return;

    }


    const check =
    setInterval(function() {


      if (
        video.videoWidth > 0 &&
        video.videoHeight > 0
      ) {

        clearInterval(check);

        resolve();

      }

    }, 50);

  });

}



/* =====================================================
   CANVAS-ВИДОИСКАТЕЛЬ
===================================================== */

function startPreview() {

  if (previewRunning) {
    return;
  }


  previewRunning = true;


  const ctx =
  previewCanvas.getContext(
    "2d",
    {
      alpha: false
    }
  );


  function drawPreview() {


    if (
      !previewRunning
    ) {

      return;

    }


    if (
      video.readyState >= 2 &&
      video.videoWidth > 0
    ) {


      const sw =
      video.videoWidth;


      const sh =
      video.videoHeight;


      /*
        Делаем квадрат из центра
        исходного изображения.

        Это соответствует прежнему
        object-fit: cover.
      */

      const size =
      Math.min(
        sw,
        sh
      );


      const sx =
      Math.floor(
        (sw - size) / 2
      );


      const sy =
      Math.floor(
        (sh - size) / 2
      );


      /*
        Для видоискателя 900x900
        более чем достаточно.

        ZXing всё равно работает
        с исходным video отдельно.
      */

      if (
        previewCanvas.width !== 900 ||
        previewCanvas.height !== 900
      ) {

        previewCanvas.width =
        900;

        previewCanvas.height =
        900;

      }


      ctx.drawImage(

        video,

        sx,
        sy,
        size,
        size,

        0,
        0,
        900,
        900

      );

    }


    requestAnimationFrame(
      drawPreview
    );

  }


  requestAnimationFrame(
    drawPreview
  );

}



/* =====================================================
   РАСПОЗНАТЬ
===================================================== */

scanButton.onclick =
recognize;


async function recognize() {

  if (busy) {
    return;
  }


  if (!video.videoWidth) {

    setStatus(
      "Камера ещё не готова",
      "error"
    );

    return;
  }


  busy = true;


  scanButton.disabled =
  true;


  setStatus(
    "Распознаю...",
    "working"
  );


  try {


    let code = null;


    const crops = [

      1.00,
      0.75,
      0.60,
      0.50,
      0.40,
      0.30

    ];



    /*
      Сначала обычное изображение.
    */

    for (
      const crop of crops
    ) {


      code =
      await tryFrame(
        crop,
        false
      );


      if (code) {
        break;
      }

    }



    /*
      Если не получилось —
      пробуем повышенный контраст.
    */

    if (!code) {


      const enhancedCrops = [

        0.75,
        0.60,
        0.50,
        0.40,
        0.30

      ];


      for (
        const crop of enhancedCrops
      ) {


        code =
        await tryFrame(
          crop,
          true
        );


        if (code) {
          break;
        }

      }

    }



    if (!code) {

      throw new Error(
        "Data Matrix не найден"
      );

    }



    /*
      ПРОВЕРКА НА ДУБЛЬ
    */

    if (
      scannedCodes.has(code)
    ) {


      setStatus(
        "⚠ Этот код уже считан",
        "duplicate"
      );


      vibrateDuplicate();

    }

    else {


      scannedCodes.add(
        code
      );


      updateCounter();


      setStatus(
        "✓ Добавлено",
        "success"
      );


      vibrateSuccess();

    }

  }

  catch (error) {


    console.error(
      error
    );


    setStatus(
      "Не найден. Попробуйте ещё раз.",
      "error"
    );

  }


  busy = false;


  scanButton.disabled =
  false;

}



/* =====================================================
   ОТПРАВИТЬ ПАРТИЮ
===================================================== */

sendButton.onclick =
sendBatch;


async function sendBatch() {


  if (
    scannedCodes.size === 0
  ) {

    return;

  }


  const codes =
  Array.from(
    scannedCodes
  );


  const comment =
  commentInput.value.trim();



  sendButton.disabled =
  true;


  scanButton.disabled =
  true;


  commentInput.disabled =
  true;



  setStatus(

    "Отправляю " +
    codes.length +
    " кодов...",

    "working"

  );



  try {


    const url =

    SCRIPT_URL +

    "?codes=" +

    encodeURIComponent(
      JSON.stringify(codes)
    )

    +

    "&comment=" +

    encodeURIComponent(
      comment
    );



    await fetch(

      url,

      {

        method: "GET",

        mode: "no-cors"

      }

    );



    /*
      После отправки очищаем
      текущую партию.
    */

    scannedCodes.clear();


    commentInput.value =
    "";


    updateCounter();



    setStatus(

      "✓ Отправлено: " +
      codes.length,

      "success"

    );



    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [100, 80, 100]
      );

    }

  }

  catch (error) {


    console.error(
      error
    );


    /*
      При ошибке список кодов
      остаётся на телефоне.
    */

    setStatus(
      "Ошибка отправки. Коды не удалены.",
      "error"
    );

  }



  sendButton.disabled =
  false;


  scanButton.disabled =
  false;


  commentInput.disabled =
  false;

}



/* =====================================================
   СЧЁТЧИК
===================================================== */

function updateCounter() {


  const count =
  scannedCodes.size;


  counter.innerText =
  "Счетчик кодов: " +
  count;


  if (
    count > 0
  ) {


    sendButton.style.display =
    "block";


    sendButton.innerText =

    "ОТПРАВИТЬ (" +
    count +
    ")";

  }

  else {


    sendButton.style.display =
    "none";

  }

}



/* =====================================================
   РАСПОЗНАВАНИЕ КАДРА
===================================================== */

async function tryFrame(
  cropRatio,
  enhance
) {


  /*
    ВАЖНО:

    Для распознавания используем
    настоящий исходный video,
    а не canvas-видоискатель.

    Поэтому качество распознавания
    не ухудшается.
  */


  const sw =
  video.videoWidth;


  const sh =
  video.videoHeight;



  const cropSize =
  Math.floor(

    Math.min(
      sw,
      sh
    )

    * cropRatio

  );



  const sx =
  Math.floor(
    (sw - cropSize) / 2
  );


  const sy =
  Math.floor(
    (sh - cropSize) / 2
  );



  const outputSize =
  Math.min(

    2200,

    Math.max(
      cropSize,
      1400
    )

  );



  scanCanvas.width =
  outputSize;


  scanCanvas.height =
  outputSize;



  const ctx =
  scanCanvas.getContext(

    "2d",

    {
      willReadFrequently: true
    }

  );



  ctx.imageSmoothingEnabled =
  false;



  ctx.drawImage(

    video,

    sx,
    sy,
    cropSize,
    cropSize,

    0,
    0,
    outputSize,
    outputSize

  );



  let imageData =
  ctx.getImageData(

    0,
    0,

    outputSize,
    outputSize

  );



  if (
    enhance
  ) {

    enhanceContrast(
      imageData
    );

  }



  const results =
  await ZXingWASM.readBarcodes(

    imageData,

    {

      formats: [
        "DataMatrix"
      ],

      tryHarder: true,

      tryRotate: true,

      tryInvert: true,

      tryDownscale: true,

      tryDenoise: true,

      maxNumberOfSymbols: 1

    }

  );



  if (
    results &&
    results.length > 0
  ) {


    for (
      const result of results
    ) {


      if (
        result &&
        result.isValid
      ) {


        console.log(
          "ZXing:",
          result
        );


        let code =
        result.text || "";



        /*
          Приводим GS1 к формату,
          который отправляем
          в Google Sheets.
        */

        code =
        code

        .replace(
          /^\(01\)/,
          "01"
        )

        .replace(
          /\(21\)/,
          "21"
        )

        .replace(
          /\(91\)/g,
          "\x1D91"
        )

        .replace(
          /\(92\)/g,
          "\x1D92"
        )

        .replace(
          /\(93\)/g,
          "\x1D93"
        );


        return code;

      }

    }

  }


  return null;

}



/* =====================================================
   КОНТРАСТ
===================================================== */

function enhanceContrast(
  imageData
) {


  const data =
  imageData.data;


  const contrast =
  1.6;



  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {


    const gray =

    0.299 * data[i] +

    0.587 * data[i + 1] +

    0.114 * data[i + 2];



    let value =

    (gray - 128)

    * contrast

    + 128;



    value =
    Math.max(

      0,

      Math.min(
        255,
        value
      )

    );



    data[i] =
    value;


    data[i + 1] =
    value;


    data[i + 2] =
    value;

  }

}



/* =====================================================
   ВИБРАЦИЯ
===================================================== */

function vibrateSuccess() {


  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      80
    );

  }

}



function vibrateDuplicate() {


  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      [50, 50, 50]
    );

  }

}



/* =====================================================
   СТАТУС
===================================================== */

function setStatus(
  text,
  className = ""
) {


  const element =
  document.getElementById(
    "status"
  );


  element.innerText =
  text;


  element.className =
  className;

}

</script>

</body>

</html>
