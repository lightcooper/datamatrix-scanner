<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>Data Matrix Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin: 8px 0 12px;
    }

    #cameraBox {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
      background: #000;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Рамка, куда желательно поместить Data Matrix */
    #aim {
      position: absolute;
      width: 45%;
      aspect-ratio: 1 / 1;
      left: 27.5%;
      top: 50%;
      transform: translateY(-50%);
      border: 3px solid white;
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.12);
    }

    #startButton,
    #scanButton {
      width: 100%;
      padding: 18px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #222;
      color: white;
    }

    #scanButton {
      background: #146c2e;
      color: white;
      display: none;
    }

    #scanButton:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 12px;
      padding: 15px;
      border-radius: 12px;
      background: white;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
    }

    #lastCode {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background: white;
      border-radius: 12px;
      font-size: 13px;
      word-break: break-all;
    }

    .success {
      background: #dff5e5 !important;
      color: #176b32;
    }

    .error {
      background: #ffe0e0 !important;
      color: #a00000;
    }

    .working {
      background: #fff3cd !important;
      color: #6b5700;
    }

    #debugCanvas {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Data Matrix</h1>

  <div id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
    <div id="aim"></div>
  </div>

  <button id="startButton">
    Запустить камеру
  </button>

  <button id="scanButton">
    РАСПОЗНАТЬ
  </button>

  <div id="status">
    Запустите камеру
  </div>

  <div id="lastCode"></div>

  <canvas id="debugCanvas"></canvas>

</div>


<script>

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby-aRQONo0El0YySDgfpcGkDG3B9u4vLcweo3AuGZc8P5gXUCBpxt6cwtnv8ut_9jlGSw/exec";

const video = document.getElementById("video");
const canvas = document.getElementById("debugCanvas");

const startButton =
  document.getElementById("startButton");

const scanButton =
  document.getElementById("scanButton");

let stream = null;
let decoder = null;
let busy = false;


/* =========================
   ЗАПУСК КАМЕРЫ
========================= */

startButton.addEventListener("click", startCamera);

async function startCamera() {

  try {

    setStatus("Запускаю камеру...", "working");

    stream = await navigator.mediaDevices.getUserMedia({

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 3840
        },

        height: {
          ideal: 2160
        }

      },

      audio: false
    });


    video.srcObject = stream;

    await video.play();


    /*
      Создаём декодер.

      Он не сканирует видеопоток постоянно.
      Используем его только после нажатия кнопки.
    */

    decoder = new Html5Qrcode(
      "hidden-reader",
      {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.DATA_MATRIX
        ]
      }
    );


    startButton.style.display = "none";
    scanButton.style.display = "block";

    setStatus(
      "Наведите рамку на Data Matrix и нажмите «Распознать»"
    );


    /*
      Показываем фактическое разрешение,
      которое дала камера.
    */

    console.log(
      "Camera resolution:",
      video.videoWidth,
      "x",
      video.videoHeight
    );


  } catch (error) {

    console.error(error);

    setStatus(
      "Не удалось открыть камеру: " + error,
      "error"
    );
  }
}


/* =========================
   КНОПКА РАСПОЗНАТЬ
========================= */

scanButton.addEventListener(
  "click",
  captureAndDecode
);


async function captureAndDecode() {

  if (busy) return;

  if (!video.videoWidth) {

    setStatus(
      "Камера ещё не готова",
      "error"
    );

    return;
  }


  busy = true;
  scanButton.disabled = true;

  setStatus(
    "Распознаю...",
    "working"
  );


  try {

    /*
      Получаем кадр в НАТИВНОМ разрешении камеры.
    */

    const sourceWidth =
      video.videoWidth;

    const sourceHeight =
      video.videoHeight;


    /*
      Берём центральную область изображения.

      55% ширины и высоты.

      Это фактически цифровое увеличение:
      маленький Data Matrix получает намного
      больше пикселей при распознавании.
    */

    const cropSize =
      Math.floor(
        Math.min(
          sourceWidth,
          sourceHeight
        ) * 0.55
      );


    const sx =
      Math.floor(
        (sourceWidth - cropSize) / 2
      );

    const sy =
      Math.floor(
        (sourceHeight - cropSize) / 2
      );


    /*
      Увеличиваем вырезанный участок
      до 1600 x 1600.
    */

    canvas.width = 1600;
    canvas.height = 1600;

    const ctx =
      canvas.getContext("2d");


    ctx.imageSmoothingEnabled = false;


    ctx.drawImage(

      video,

      sx,
      sy,
      cropSize,
      cropSize,

      0,
      0,
      1600,
      1600

    );


    /*
      Canvas -> изображение.
    */

    const imageData =
      canvas.toDataURL(
        "image/png"
      );


    /*
      DataURL превращаем в Blob/File,
      который html5-qrcode умеет
      распознавать как фотографию.
    */

    const response =
      await fetch(imageData);

    const blob =
      await response.blob();

    const file =
      new File(
        [blob],
        "capture.png",
        {
          type: "image/png"
        }
      );


    /*
      Распознаём фотографию.
    */

    const result =
      await decoder.scanFile(
        file,
        false
      );


    if (!result) {

      throw new Error(
        "Data Matrix не найден"
      );
    }


    showCode(result);

    setStatus(
      "Код найден. Сохраняю...",
      "working"
    );


    await saveCode(result);


    setStatus(
      "✓ Сохранено",
      "success"
    );


    if (navigator.vibrate) {
      navigator.vibrate(100);
    }


  } catch (error) {

    console.error(error);

    setStatus(
      "Data Matrix не найден. Попробуйте ещё раз.",
      "error"
    );

  }


  busy = false;
  scanButton.disabled = false;
}


/* =========================
   СОХРАНЕНИЕ В GOOGLE SHEETS
========================= */

async function saveCode(code) {

  const url =
    SCRIPT_URL +
    "?code=" +
    encodeURIComponent(code);


  await fetch(
    url,
    {
      method: "GET",
      mode: "no-cors"
    }
  );
}


/* =========================
   ИНТЕРФЕЙС
========================= */

function setStatus(
  text,
  className = ""
) {

  const status =
    document.getElementById("status");

  status.innerText = text;
  status.className = className;
}


function showCode(code) {

  const element =
    document.getElementById("lastCode");

  element.style.display = "block";

  element.innerText =
    "Распознано:\n" + code;
}

</script>


<!--
  Этот элемент нужен библиотеке html5-qrcode,
  но пользователю его показывать не нужно.
-->
<div
  id="hidden-reader"
  style="display:none">
</div>

</body>
</html>
