<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>Data Matrix Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3/dist/iife/reader/index.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin: 8px 0 12px;
    }

    #cameraBox {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
      background: #000;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
    }

    #aim {
      position: absolute;
      width: 42%;
      aspect-ratio: 1 / 1;
      left: 29%;
      top: 50%;
      transform: translateY(-50%);
      border: 3px solid white;
      border-radius: 8px;
      pointer-events: none;
    }

    button {
      width: 100%;
      padding: 19px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    #startButton {
      background: #222;
      color: white;
    }

    #scanButton {
      display: none;
      background: #146c2e;
      color: white;
    }

    #scanButton:disabled {
      opacity: .5;
    }

    #status {
      margin-top: 12px;
      padding: 15px;
      border-radius: 12px;
      background: white;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
    }

    #lastCode {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background: white;
      border-radius: 12px;
      word-break: break-all;
      font-size: 13px;
    }

    .success {
      background: #dff5e5 !important;
      color: #176b32;
    }

    .error {
      background: #ffe0e0 !important;
      color: #a00000;
    }

    .working {
      background: #fff3cd !important;
      color: #6b5700;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Data Matrix</h1>

  <div id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
    <div id="aim"></div>
  </div>

  <button id="startButton">
    Запустить камеру
  </button>

  <button id="scanButton">
    РАСПОЗНАТЬ
  </button>

  <div id="status">
    Запустите камеру
  </div>

  <div id="lastCode"></div>

  <canvas id="canvas"></canvas>

</div>

<script>

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby-aRQONo0El0YySDgfpcGkDG3B9u4vLcweo3AuGZc8P5gXUCBpxt6cwtnv8ut_9jlGSw/exec";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const startButton = document.getElementById("startButton");
const scanButton = document.getElementById("scanButton");

let stream = null;
let busy = false;


/* ==========================
   КАМЕРА
========================== */

startButton.onclick = startCamera;

async function startCamera() {

  try {

    setStatus("Запускаю камеру...", "working");

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 3840
          },

          height: {
            ideal: 2160
          }

        },

        audio: false
      });

    video.srcObject = stream;

    await video.play();

    startButton.style.display = "none";
    scanButton.style.display = "block";

    setStatus(
      "Поместите Data Matrix примерно в центр рамки"
    );

    console.log(
      "Разрешение:",
      video.videoWidth,
      "x",
      video.videoHeight
    );

  }

  catch (e) {

    console.error(e);

    setStatus(
      "Ошибка камеры: " + e,
      "error"
    );
  }
}


/* ==========================
   РАСПОЗНАВАНИЕ
========================== */

scanButton.onclick = recognize;

async function recognize() {

  if (busy) return;

  if (!video.videoWidth) {
    setStatus("Камера ещё не готова", "error");
    return;
  }

  busy = true;
  scanButton.disabled = true;

  setStatus(
    "Ищу Data Matrix...",
    "working"
  );

  try {

    /*
      Сначала пробуем разные размеры
      центральной области.

      1.0 = весь кадр
      0.70 = 70%
      0.50 = 50%
      0.35 = 35%
    */

    const crops = [
      1.00,
      0.70,
      0.50,
      0.35
    ];

    let code = null;

    for (const crop of crops) {

      code = await tryFrame(
        crop,
        false
      );

      if (code) break;
    }


    /*
      Если обычные варианты не помогли,
      пробуем усиленный контраст.
    */

    if (!code) {

      for (const crop of [
        0.70,
        0.50,
        0.35
      ]) {

        code = await tryFrame(
          crop,
          true
        );

        if (code) break;
      }
    }


    if (!code) {

      throw new Error(
        "Data Matrix не найден"
      );
    }


    showCode(code);

    setStatus(
      "Код найден. Сохраняю...",
      "working"
    );


    await saveCode(code);


    setStatus(
      "✓ Сохранено",
      "success"
    );


    if (navigator.vibrate) {
      navigator.vibrate(100);
    }

  }

  catch (e) {

    console.error(e);

    setStatus(
      "Data Matrix не найден. Наведите рамку точнее и повторите.",
      "error"
    );
  }

  busy = false;
  scanButton.disabled = false;
}


/* ==========================
   ОДНА ПОПЫТКА
========================== */

async function tryFrame(
  cropRatio,
  enhance
) {

  const sw = video.videoWidth;
  const sh = video.videoHeight;

  const cropSize =
    Math.floor(
      Math.min(sw, sh) * cropRatio
    );

  const sx =
    Math.floor(
      (sw - cropSize) / 2
    );

  const sy =
    Math.floor(
      (sh - cropSize) / 2
    );


  /*
    Не уменьшаем маленький фрагмент.

    Центральные crop-варианты увеличиваем
    для декодера.
  */

  const outputSize =
    Math.min(
      2200,
      Math.max(
        cropSize,
        1400
      )
    );


  canvas.width = outputSize;
  canvas.height = outputSize;

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

  ctx.imageSmoothingEnabled = false;


  ctx.drawImage(

    video,

    sx,
    sy,
    cropSize,
    cropSize,

    0,
    0,
    outputSize,
    outputSize

  );


  let imageData =
    ctx.getImageData(
      0,
      0,
      outputSize,
      outputSize
    );


  if (enhance) {

    enhanceContrast(
      imageData
    );
  }


  const results =
    await ZXingWASM.readBarcodes(

      imageData,

      {
        formats: [
          "DataMatrix"
        ],

        tryHarder: true,
        tryRotate: true,
        tryInvert: true,
        tryDownscale: true,
        tryDenoise: true,

        maxNumberOfSymbols: 1
      }
    );


  if (
    results &&
    results.length > 0
  ) {

    for (const result of results) {

      if (
  result &&
  result.isValid
) {

  console.log(
    "Полный результат ZXing:",
    result
  );

  // Для GS1 Data Matrix восстанавливаем исходную строку,
  // которую ожидает система маркировки.
  let code = result.text || "";

  code = code
    .replace(/^\(01\)/, "01")
    .replace(/\(21\)/, "21")
    .replace(/\(91\)/g, "\x1D91")
    .replace(/\(92\)/g, "\x1D92")
    .replace(/\(93\)/g, "\x1D93");

  return code;
}
    }
  }

  return null;
}


/* ==========================
   УСИЛЕНИЕ КОНТРАСТА
========================== */

function enhanceContrast(imageData) {

  const data =
    imageData.data;

  const contrast = 1.6;

  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const gray =
      0.299 * data[i] +
      0.587 * data[i + 1] +
      0.114 * data[i + 2];


    let value =
      (gray - 128) *
      contrast +
      128;


    value =
      Math.max(
        0,
        Math.min(
          255,
          value
        )
      );


    data[i] = value;
    data[i + 1] = value;
    data[i + 2] = value;
  }
}


/* ==========================
   GOOGLE SHEETS
========================== */

async function saveCode(code) {

  const url =
    SCRIPT_URL +
    "?code=" +
    encodeURIComponent(code);


  await fetch(
    url,
    {
      method: "GET",
      mode: "no-cors"
    }
  );
}


/* ==========================
   ИНТЕРФЕЙС
========================== */

function setStatus(
  text,
  className = ""
) {

  const element =
    document.getElementById(
      "status"
    );

  element.innerText = text;
  element.className = className;
}


function showCode(code) {

  const element =
    document.getElementById(
      "lastCode"
    );

  element.style.display =
    "block";

  element.innerText =
    "Распознано:\n" +
    code;
}

</script>

</body>
</html>
